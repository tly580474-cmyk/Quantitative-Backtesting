# Include inside each server. Auth subrequests renew the browser's 72-hour cookie.
auth_request /_quant_session;
auth_request_set $quant_session_cookie $upstream_http_set_cookie;
add_header Set-Cookie $quant_session_cookie always;
error_page 401 = @quant_login;

location = /_quant_session {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:3002/check;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-Origin $http_origin;
    proxy_set_header X-Original-Fetch-Site $http_sec_fetch_site;
}
location /auth/ {
    auth_request off;
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8k;
}
location @quant_login {
    auth_request off;
    if ($uri ~ ^/api/) { return 401; }
    # Serve the login form at the original URL; no unsafe redirect interpolation.
    proxy_pass http://127.0.0.1:3002;
    rewrite ^ /auth/login? break;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
