user www-data;
worker_processes 1;
pid /run/quant-public.pid;
error_log /var/log/nginx/quant-public-error.log;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/quant-public-access.log;
  server {
    listen 8080;
    server_name _;
    auth_basic "Quant test environment";
    auth_basic_user_file /etc/nginx/quant.htpasswd;
    root /opt/quant-backtest/dist;
    location / { try_files $uri $uri/ /index.html; }
    location /api/admin/ { return 403; }
    location /api/ { include /etc/nginx/quant-proxy.conf; }
  }
}
