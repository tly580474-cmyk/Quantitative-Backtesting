server {
  listen 8081;
  server_name _;
  root /opt/quant-backtest/admin/dist;
  # Bearer headers used by the admin app cannot coexist with Basic auth in the
  # same Authorization header. Protect the page with Basic; APIs retain token auth.
  location / {
    auth_basic "Quant administration";
    auth_basic_user_file /etc/nginx/quant.htpasswd;
    try_files $uri $uri/ /index.html;
  }
  location /api/agent { return 403; }
  location /api/admin/ { include /etc/nginx/quant-proxy.conf; }
  location /api/ { return 403; }
}
