server {
  server_tokens off;
  listen 8081;
  server_name _;
  root /opt/quant-backtest/admin/dist;
  include /etc/nginx/quant-session.conf;
  # APIs retain independent Bearer authentication for existing admin clients.
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /api/agent { return 403; }
  location /api/admin/ {
    auth_request off;
    error_page 401 = @admin_unauthorized;
    include /etc/nginx/quant-proxy.conf;
  }
  location @admin_unauthorized { return 401; }
  location /api/ { return 403; }
}
